<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 背景圆角矩形（图片） -->
  <rect x="6" y="10" width="36" height="36" rx="4" ry="4"
        fill="none" stroke="#1e1e1e" stroke-width="3"/>
  <!-- 图片山形示意 -->
  <path d="M12 38 L20 26 L26 34 L32 22 L38 38 Z"
        fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="16" cy="20" r="2.5" fill="#1e1e1e"/>
  <!-- 放大镜 -->
  <circle cx="42" cy="42" r="11"
          fill="#fffce8" stroke="#1e1e1e" stroke-width="3"/>
  <line x1="50" y1="50" x2="58" y2="58"
        stroke="#1e1e1e" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 加号（放大语义） -->
  <line x1="42" y1="37" x2="42" y2="47" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="37" y1="42" x2="47" y2="42" stroke="#1e1e1e" stroke-width="2.2" stroke-linecap="round"/>
</svg>
